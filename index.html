<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap');

    body{
      min-height: 100vh;
      display: flex;
      justify-content: center; /*alinha no centro horizontal*/
      align-items: center; /*alinha no centro vertical*/
      margin: 0;
      background-color: hsl(0, 0%, 8%);
      font-family: "Outfit", sans-serif;
      font-weight: bold;
    }

    main{
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: hsl(0, 0%, 12%);
      padding: 30px;
      border-radius: 12px;
      max-width: 320px;
      height: auto;
      box-sizing: border-box;
      text-align: center;

    }

    img{
      width: 70px;
      height: 70px;
      border-radius: 50%;
    }

    ul{
      width: 100%; /*a lista ocupada toda a largura do card*/
      display: flex;
      flex-direction: column;
      gap: 15px;
      list-style: none; /*remove as bolinhas*/
      padding: 0; /*remove recuo padrão*/
      margin: 0; /*remove recuo padrão*/ 
    }

    ul li > a{
      display: block;
      background-color: hsl(0, 0%, 20%);
      padding: 12px 0px;
      border-radius: 4px;
      text-decoration: none;
      color: white;
    }
    


    
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<main>
  <img src="assets/images/avatar-jessica.jpeg" alt="perfil">
  <h2 style="color: white;">Jessica Randall</h2>
  <span style="color: hsl(75, 94%, 57%);"> London, United Kingdom</span>
  <p style="color: rgba(240, 248, 255, 0.484);">"Front-end developer and avid reader."</p>

  <ul>
    <li><a href="#">GitHub</a></li>
    <li><a href="#">Frontend Mentor</a></li>
    <li><a href="#">LinkedIn</a></li>
    <li><a href="#">Twitter</a></li>
    <li><a href="#">Instagram</a></li>
  </ul>
</main>

</body>
</html>
